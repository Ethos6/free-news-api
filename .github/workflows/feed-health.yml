name: Feed health

# Fetches every source once from a GitHub runner and posts a table in the job summary.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Check every feed
        env:
          FREENEWS_COUNTRIES: us,gb,in,au,ca
        run: freenews check | tee -a "$GITHUB_STEP_SUMMARY"
