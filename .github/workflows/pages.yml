name: Free hosted API (GitHub Pages)

# Rebuilds the static JSON API every 30 minutes and publishes it to GitHub Pages:
#   https://<owner>.github.io/<repo>/v1/trending.json
# Fork the repo, enable Pages (Settings → Pages → Source: GitHub Actions) and you have your own.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FREENEWS_COUNTRIES: us,gb,in,au,ca,sg,za,ng
      FREENEWS_TREND_GEOS: US,GB,IN,AU,CA
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Build static API
        run: freenews build --out site --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
