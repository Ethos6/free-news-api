services:
  freenews:
    build: .
    # image: ghcr.io/ethos6/free-news-api:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - freenews-data:/data   # keeps the article index across restarts
    restart: unless-stopped

volumes:
  freenews-data:
