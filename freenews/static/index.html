<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeNews API — world trending news</title>
<style>
  :root { --bg:#f7f7f5; --fg:#18181b; --muted:#71717a; --card:#fff; --line:#e4e4e7; --accent:#c2410c; --chip:#fff7ed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --fg:#f4f4f5; --muted:#a1a1aa; --card:#18181b; --line:#27272a; --accent:#fb923c; --chip:#2a1a10; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { max-width:1100px; margin:0 auto; padding:28px 16px 8px; }
  h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  .sub { color:var(--muted); margin:4px 0 16px; font-size:14px; }
  .sub code { background:var(--card); border:1px solid var(--line); padding:1px 6px; border-radius:6px; font-size:12px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button { font:inherit; font-size:13px; padding:6px 12px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  nav button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns: 1fr 300px; gap:24px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .story { display:grid; grid-template-columns: 1fr 120px; gap:14px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; }
  .story.noimg { grid-template-columns: 1fr; }
  .story img { width:120px; height:90px; object-fit:cover; border-radius:10px; background:var(--line); }
  .story a.t { color:var(--fg); font-weight:650; font-size:17px; text-decoration:none; line-height:1.3; }
  .story a.t:hover { color:var(--accent); }
  .story p { margin:6px 0; color:var(--muted); font-size:14px; }
  .meta { font-size:12px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .badge { background:var(--chip); color:var(--accent); border-radius:99px; padding:1px 8px; font-weight:600; }
  .rank { color:var(--accent); font-weight:700; margin-right:6px; }
  aside h3 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  aside ol { margin:0 0 24px; padding-left:20px; }
  aside li { margin:4px 0; font-size:14px; }
  aside li span { color:var(--muted); font-size:12px; }
  aside a { color:var(--fg); }
  footer { max-width:1100px; margin:0 auto; padding:24px 16px 48px; color:var(--muted); font-size:13px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🌍 FreeNews API</h1>
  <p class="sub">World top trending news, clustered across outlets. Free and open source. <span id="upd"></span> · JSON: <code id="ep"></code></p>
  <nav id="cats"></nav>
</header>
<main>
  <section id="stories"><p class="sub">Loading…</p></section>
  <aside>
    <h3>Trending searches</h3><ol id="gt"></ol>
    <h3>Most read on Wikipedia</h3><ol id="wk"></ol>
  </aside>
</main>
<footer>Open source (MIT) · <a href="https://github.com/Ethos6/free-news-api">GitHub</a> · Headlines link to the original publishers.</footer>
<script>
const MODE = "__MODE__";  // "live" (server) or "static" (GitHub Pages)
const CATS = ["top","world","business","technology","science","health","sports","entertainment"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe = u => /^https?:\/\//i.test(u || "") ? u : "#";
const ago = iso => { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m/60)}h ago` : `${Math.round(m/1440)}d ago`; };
const url = (cat) => MODE === "static"
  ? (cat === "top" ? "v1/trending.json" : `v1/trending/${cat}.json`)
  : `v1/trending?limit=30${cat === "top" ? "" : "&category=" + cat}`;
let current = "top";
function tabs() {
  $("#cats").innerHTML = CATS.map(c => `<button class="${c===current?'on':''}" data-c="${c}">${c[0].toUpperCase()+c.slice(1)}</button>`).join("");
  $("#cats").querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.c; tabs(); load(); });
}
async function load() {
  $("#ep").textContent = url(current);
  try {
    const d = await (await fetch(url(current))).json();
    $("#upd").textContent = d.updated_at ? `Updated ${ago(d.updated_at)}.` : "";
    $("#stories").innerHTML = d.stories.map((s, i) => `
      <article class="story ${s.image ? "" : "noimg"}">
        <div>
          <a class="t" href="${esc(safe(s.url))}" target="_blank" rel="noopener"><span class="rank">${i+1}</span>${esc(s.title)}</a>
          ${s.description ? `<p>${esc(s.description.slice(0, 220))}</p>` : ""}
          <div class="meta"><span class="badge">${s.sources_count} outlets</span><span>${esc(s.category)}</span>
            <span>${ago(s.latest)}</span><span>${esc(s.sources.slice(0, 5).join(" · "))}</span></div>
        </div>
        ${s.image ? `<img src="${esc(safe(s.image))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      </article>`).join("") || '<p class="sub">No stories yet — the first refresh takes about a minute.</p>';
  } catch (e) { $("#stories").innerHTML = `<p class="sub">Could not load: ${esc(e.message)}</p>`; }
}
async function trends() {
  try {
    const d = await (await fetch(MODE === "static" ? "v1/trends.json" : "v1/trends")).json();
    const g = Object.values(d.google_trends || {})[0] || [];
    $("#gt").innerHTML = g.slice(0, 12).map(t => `<li><a href="${esc(safe(t.url))}" target="_blank" rel="noopener">${esc(t.title)}</a> <span>${esc(t.traffic || "")}</span></li>`).join("") || "<li>—</li>";
    $("#wk").innerHTML = (d.wikipedia_most_read || []).slice(0, 10).map(t => `<li><a href="${esc(safe(t.url))}" target="_blank" rel="noopener">${esc(t.title)}</a> <span>${esc(t.traffic || "")}</span></li>`).join("") || "<li>—</li>";
  } catch (e) {}
}
tabs(); load(); trends();
</script>
</body>
</html>
